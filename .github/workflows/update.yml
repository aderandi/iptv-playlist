name: Auto Merge Playlist

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Download and Merge Playlist
        run: |
          node -e '
          const { chromium } = require("playwright");
          const fs = require("fs");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              acceptDownloads: true,
              userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            });
            const page = await context.newPage();

            console.log("Memicu unduhan file playlist...");
            
            // Tangkap event download browser
            const downloadPromise = page.waitForEvent("download", { timeout: 60000 });
            await page.goto("https://tv.ngebutz.my.id/playlist/nonton2025/12345/m3u_plus").catch(() => {});
            
            const download = await downloadPromise;
            const downloadPath = "./downloaded_playlist.m3u";
            await download.saveAs(downloadPath);
            await browser.close();

            if (!fs.existsSync(downloadPath)) {
              console.log("Gagal: File unduhan tidak ditemukan.");
              process.exit(1);
            }

            let content = fs.readFileSync(downloadPath, "utf-8");
            content = content.replace(/^\uFEFF/, "").trim();

            if (!content.includes("#EXTINF")) {
              console.log("Gagal: File terunduh tapi tidak ada tag #EXTINF.");
              process.exit(1);
            }

            // 1. Baca channel lokal dari local.m3u
            let localLines = [];
            if (fs.existsSync("local.m3u")) {
              localLines = fs.readFileSync("local.m3u", "utf-8")
                .split(/\r?\n/)
                .filter(line => !line.trim().startsWith("#EXTM3U") && line.trim() !== "");
            }

            // 2. Filter isi playlist unduhan
            const targetLines = content
              .split(/\r?\n/)
              .filter(line => !line.trim().startsWith("#EXTM3U") && line.trim() !== "");

            // 3. Gabungkan menjadi satu file sosial.m3u
            const finalM3U = ["#EXTM3U", ...localLines, ...targetLines].join("\n") + "\n";
            fs.writeFileSync("sosial.m3u", finalM3U, "utf-8");
            
            // Bersihkan file sementara
            fs.unlinkSync(downloadPath);
            console.log(`Sukses! ${targetLines.length} baris channel berhasil digabungkan.`);
          })();
          '

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sosial.m3u
          git commit -m "Auto update playlist [$(date +'%Y-%m-%d %H:%M')]" || exit 0
          git push
