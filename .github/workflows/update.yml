name: Auto Merge Playlist

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Scrape and Merge Playlist
        run: |
          node -e '
          const { chromium } = require("playwright");
          const fs = require("fs");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            });
            const page = await context.newPage();

            console.log("Mengakses server target...");
            const response = await page.goto("https://tv.ngebutz.my.id/playlist/nonton2025/12345/m3u_plus", {
              waitUntil: "networkidle",
              timeout: 60000
            });

            const content = await response.text();
            await browser.close();

            if (!content.includes("#EXTINF")) {
              console.log("Gagal: Konten tidak valid atau kosong.");
              process.exit(0);
            }

            // 1. Baca channel lokal jika ada
            let localContent = "";
            if (fs.existsSync("local.m3u")) {
              localContent = fs.readFileSync("local.m3u", "utf-8")
                .split("\n")
                .filter(line => !line.trim().startsWith("#EXTM3U") && line.trim() !== "")
                .join("\n");
            }

            // 2. Filter isi target
            const targetLines = content
              .split("\n")
              .filter(line => !line.trim().startsWith("#EXTM3U") && line.trim() !== "")
              .join("\n");

            // 3. Gabungkan dan simpan
            const finalM3U = "#EXTM3U\n" + (localContent ? localContent + "\n" : "") + targetLines + "\n";
            fs.writeFileSync("sosial.m3u", finalM3U, "utf-8");
            console.log("Berhasil menggabungkan seluruh channel!");
          })();
          '

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sosial.m3u
          git commit -m "Auto update playlist [$(date +'%Y-%m-%d %H:%M')]" || exit 0
          git push
