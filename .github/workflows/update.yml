name: Auto Merge Playlist

on:
  schedule:
    - cron: '0 */3 * * *' # Berjalan otomatis tiap 3 jam
  workflow_dispatch: # Tombol manual 'Run workflow'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Merge Playlists
        run: |
          # 1. Buat ulang sosial.m3u dengan header utama
          echo "#EXTM3U" > sosial.m3u

          # 2. Masukkan daftar channel lokal jika file local.m3u ada
          if [ -f "local.m3u" ]; then
            grep -v '^#EXTM3U' local.m3u >> sosial.m3u
            echo "" >> sosial.m3u
          fi

          # 3. Download playlist Ngebutz dengan Header & User-Agent pemutar Android
          curl -s -k -L \
            --http1.1 \
            -H "User-Agent: OTT Navigator 1.9.6.4 (Android)" \
            -H "Accept: */*" \
            -H "Connection: keep-alive" \
            "https://tv.ngebutz.my.id/playlist/nonton2025/12345/m3u_plus" > remote.m3u

          # 4. Validasi isi file: pastikan berisi channel (#EXTINF), bukan error HTML 403
          if grep -q "#EXTINF" remote.m3u; then
            grep -v '^#EXTM3U' remote.m3u >> sosial.m3u
            echo "Berhasil menggabungkan channel dari Ngebutz."
          else
            echo "Gagal: Server merespons selain channel valid. Isi file:"
            cat remote.m3u | head -n 10
          fi

          rm -f remote.m3u

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sosial.m3u
          git commit -m "Auto merge playlist [$(date +'%Y-%m-%d %H:%M')]" || exit 0
          git push
