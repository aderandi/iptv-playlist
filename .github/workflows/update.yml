name: Auto Merge Playlist

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and Merge Playlist
        run: |
          echo "#EXTM3U" > sosial.m3u

          # 1. Masukkan channel lokal jika ada
          if [ -f "local.m3u" ]; then
            grep -v '^#EXTM3U' local.m3u >> sosial.m3u
            echo "" >> sosial.m3u
          fi

          # 2. Download via CorsProxy Bridge untuk menembus blokir IP GitHub Actions
          curl -s -L "https://corsproxy.io/?url=https%3A%2F%2Ftv.ngebutz.my.id%2Fplaylist%2Fnonton2025%2F12345%2Fm3u_plus" > remote.m3u

          # 3. Masukkan channel jika valid
          if grep -q "#EXTINF" remote.m3u; then
            grep -v '^#EXTM3U' remote.m3u >> sosial.m3u
            echo "Channel berhasil ditarik dan digabung!"
          else
            echo "Proxy gagal mengambil channel."
          fi

          rm -f remote.m3u

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sosial.m3u
          git commit -m "Auto update playlist [$(date +'%Y-%m-%d %H:%M')]" || exit 0
          git push
