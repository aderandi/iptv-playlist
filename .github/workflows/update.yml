name: Auto Merge Playlist

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gabungkan Playlist
        run: |
          echo "#EXTM3U" > sosial.m3u
          
          # 1. Masukkan channel lokal
          if [ -f "local.m3u" ]; then
            grep -v '^#EXTM3U' local.m3u >> sosial.m3u
            echo "" >> sosial.m3u
          fi
          
          # 2. Ambil playlist Ngebutz via Proxy Bridge (Bypass 403 Datacenter)
          curl -s -L "https://api.allorigins.win/raw?url=https%3A%2F%2Ftv.ngebutz.my.id%2Fplaylist%2Fnonton2025%2F12345%2Fm3u_plus" > temp.m3u
          
          # 3. Validasi: hanya masukkan jika isi file adalah channel M3U (bukan HTML 403)
          if grep -q "#EXTINF" temp.m3u; then
            grep -v '^#EXTM3U' temp.m3u >> sosial.m3u
          fi
          
          rm -f temp.m3u

      - name: Simpan Perubahan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sosial.m3u
          git commit -m "Auto update playlist" || exit 0
          git push
