name: Auto Merge Playlist

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Impersonate Library
        run: pip install curl_cffi

      - name: Download & Merge Playlist
        run: |
          python -c '
          import os
          from curl_cffi import requests

          target_url = "https://tv.ngebutz.my.id/playlist/nonton2025/12345/m3u_plus"

          print("Mengunduh playlist dengan impersonasi browser/Android...")
          try:
              # Meniru sidik jari TLS Chrome/Android asli untuk membobol 403
              res = requests.get(
                  target_url,
                  impersonate="chrome120",
                  headers={"User-Agent": "OTT Navigator 1.9.6.4 (Android)"},
                  timeout=30
              )
              
              if res.status_code != 200:
                  print(f"Server menolak dengan status: {res.status_code}")
                  exit(1)

              content = res.text.replace("\ufeff", "").strip()

              if "#EXTINF" not in content and "#EXTM3U" not in content:
                  print("Konten yang didapat bukan M3U valid:")
                  print(content[:300])
                  exit(1)

              # 1. Baca channel lokal dari local.m3u jika ada
              local_lines = []
              if os.path.exists("local.m3u"):
                  with open("local.m3u", "r", encoding="utf-8") as f:
                      for line in f:
                          trimmed = line.strip()
                          if trimmed and not trimmed.startswith("#EXTM3U"):
                              local_lines.append(trimmed)

              # 2. Ambil channel dari server target
              target_lines = []
              for line in content.splitlines():
                  trimmed = line.strip()
                  if trimmed and not trimmed.startswith("#EXTM3U"):
                      target_lines.append(trimmed)

              # 3. Gabungkan dan simpan ke sosial.m3u
              final_data = ["#EXTM3U"] + local_lines + target_lines
              with open("sosial.m3u", "w", encoding="utf-8") as f:
                  f.write("\n".join(final_data) + "\n")

              print(f"SUKSES! Berhasil menggabungkan {len(target_lines)} baris channel ke sosial.m3u.")

          except Exception as e:
              print(f"Error: {e}")
              exit(1)
          '

      - name: Commit and Push Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sosial.m3u
          git commit -m "Auto update merged playlist [$(date +'%Y-%m-%d %H:%M')]" || exit 0
          git push
